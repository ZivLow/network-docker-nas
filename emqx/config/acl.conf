%% EMQX file-based authorization rules (deny by default via authorization.no_match=deny).
%% Syntax: {Action, Who, Permission, Topics}. First match wins, top-to-bottom.
%% Comments MUST use %% (the file is parsed with erl_parse; '#' is a syntax error).
%%
%% This is a TEST policy: superusers (is_superuser=true in the built-in DB, or
%% matching the regex below) get everything; dev-* clients are confined to the
%% dev/# namespace. Adjust to your needs.

%% 1) Superusers (belt-and-suspenders on top of is_superuser).
{allow, {username, {re, "^(admin|root-.*|svc-.*)$"}}, all, ["#"]}.

%% 2) Dev clients: the shared dev/# namespace only.
{allow, {username, {re, "^dev-.*"}}, all, ["dev/#"]}.

%% 3) Deny $SYS before the anonymous rule below (authz '#' DOES match $SYS topics).
{deny, all, all, ["$SYS/#"]}.

%% 4) Anonymous (empty-username) clients: full access; identified only by clientid regex. Pair with the ANONYMOUS SWITCH in emqx.conf.
{allow, {clientid, {re, "^anon-.*"}}, all, ["#"]}.

%% 5) Default deny.
{deny, all}.