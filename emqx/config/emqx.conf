## EMQX Enterprise (BSL, latest = 6.3.x, OSS-compatible core) - Rock 5B (arm64)
## 1883 plain (MQTT v3.1 / v3.1.1 / v5)
## 8883 TLS mutual-auth + MQTT5 SCRAM enhanced-auth (v5) with v3/v3.1.1 fallback
## 9001 secure WebSocket (WSS), one-way TLS
## 18083 dashboard (published LAN-only from compose)
##
## NOTE ON PERSISTENCE: EMQX 5.x/6.x config precedence is
##   base.hocon < cluster.hocon (UI/API) < THIS emqx.conf < environment variables
## So this file re-applies on EVERY restart and is the source of truth for the
## keys it declares (listeners, authentication chain, tls, authz). User records
## (SCRAM + password-based) live in the built-in DB under ./emqx/data and are NOT
## wiped by this file. To change something live without editing the file, use the
## Dashboard/API -- but be aware a restart re-asserts whatever is declared here.

node {
  name     = "emqx@127.0.0.1"
  data_dir = "data"
}
## Cookie is injected via EMQX_NODE__COOKIE env var (see docker-compose.yml).

## ---- MQTT protocol: keep v3.1 / v3.1.1 / v5 all enabled (defaults) ----
mqtt {
  max_packet_size       = 1MB
  max_clientid_len      = 65535
  max_topic_levels      = 128
  max_topic_alias       = 65535
  max_inflight          = 32
  max_mqueue_len        = 1000
  max_subscriptions     = 1024
  keepalive_multiplier  = 1.25
  upgrade_qos           = false
  retain_available      = true
  wildcard_subscription = true
  shared_subscription   = true
}

## ---- Listeners ----
listeners.tcp.default {
  enable          = true
  bind            = "0.0.0.0:1883"
  max_connections = 65536
  acceptors       = 4
}

listeners.ssl.default {
  enable          = true
  bind            = "0.0.0.0:8883"
  max_connections = 65536
  acceptors       = 4
  ssl_options {
    cacertfile    = "/opt/emqx/certs/ca.crt"
    certfile      = "/opt/emqx/certs/server.crt"
    keyfile       = "/opt/emqx/certs/server.key"

    ## Mutual authentication: client MUST present a cert signed by our CA.
    verify               = verify_peer
    fail_if_no_peer_cert = true

    ## TLS hardening: only modern AEAD/ECDSA suites (ECDSA P-256 certs).
    versions             = ["tlsv1.3", "tlsv1.2"]
    honor_cipher_order   = true
    depth                = 2
    reuse_sessions       = true
    ciphers = [
      "TLS_AES_256_GCM_SHA384",
      "TLS_CHACHA20_POLY1305_SHA256",
      "TLS_AES_128_GCM_SHA256",
      "ECDHE-ECDSA-AES256-GCM-SHA384",
      "ECDHE-ECDSA-CHACHA20-POLY1305",
      "ECDHE-ECDSA-AES128-GCM-SHA256"
    ]
  }
}

## MQTT over WebSocket with TLS on 9001 (one-way TLS: browser clients can't
## present TLS client certs; MQTT credential auth still enforced by the chain).
listeners.wss.default {
  enable          = true
  bind            = "0.0.0.0:9001"
  max_connections = 65536
  acceptors       = 4
  ssl_options {
    cacertfile    = "/opt/emqx/certs/ca.crt"
    certfile      = "/opt/emqx/certs/server.crt"
    keyfile       = "/opt/emqx/certs/server.key"

    verify               = verify_peer
    fail_if_no_peer_cert = false

    versions             = ["tlsv1.3", "tlsv1.2"]
    honor_cipher_order   = true
    depth                = 2
    reuse_sessions       = true
    ciphers = [
      "TLS_AES_256_GCM_SHA384",
      "TLS_CHACHA20_POLY1305_SHA256",
      "TLS_AES_128_GCM_SHA256",
      "ECDHE-ECDSA-AES256-GCM-SHA384",
      "ECDHE-ECDSA-CHACHA20-POLY1305",
      "ECDHE-ECDSA-AES128-GCM-SHA256"
    ]
  }
}

## Shut off the unused plain-WS listener.
listeners.ws.default.enable = false

## ---- Authentication chain (ordered; first non-ignore wins) ----
## 1) SCRAM-SHA-256 enhanced-auth: MQTT 5 only. Non-MQTT5 conns -> provider
##    returns 'ignore' (emqx_authn_scram_mnesia), so it is skipped for v3/3.1.1.
## 2) password_based built-in DB: serves v3.1 / v3.1.1 (and v5 plain login).
##    SCRAM/v5 enhanced conns carry auth_method -> provider returns 'ignore'.
## => Backward-compatible coexistence via mechanism-based 'ignore' (no condition
##    field needed; works identically on OSS and Enterprise).
authentication = [
  ## ANONYMOUS SWITCH: set enable = false to disable anonymous access.
  {
    enable    = true
    mechanism = cinfo
    checks = [
      { is_match = "str_eq(username, '')", result = allow }
    ]
  },
  {
    enable          = true
    mechanism       = scram
    backend         = built_in_database
    algorithm       = sha256
    iteration_count = 10000
  },
  {
    enable        = true
    mechanism     = password_based
    backend       = built_in_database
    user_id_type  = username
    ## bootstrap_file defaults to ${EMQX_ETC_DIR}/auth-built-in-db-bootstrap.csv.
    ## The file is bind-mounted there from ./emqx/config/ via docker compose `configs:`.
    bootstrap_type = plain
    password_hash_algorithm {
      name = bcrypt
    }
  }
]

## ---- Authorization: DISABLED (ACL off) ----
## To re-enable ACL: set no_match = deny and enable = true below.
authorization {
  no_match    = allow
  deny_action = ignore
  sources = [
    { type = file, enable = false, path = "/opt/emqx/etc/acl.conf" }
  ]
}

## ---- Dashboard ----
dashboard {
  listeners.http {
    enable = true
    bind   = "0.0.0.0:18083"
  }
}

## ---- Disable $SYS broadcast chatter (schema is union([disabled, duration])) ----
## Set only if you don't need broker metrics on $SYS/broker/* topics.
sys_topics {
  sys_msg_interval       = disabled
  sys_heartbeat_interval = disabled
}

## ---- Logging ----
log {
  console {
    enable = true
    level  = warning
  }
  file {
    default {
      enable = true
      level  = warning
      path   = "log/erlang.log"
    }
  }
}